<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <header>Avengers Character Search</header>
        <section class="search-panel">
            <label for="search-field">Search by Full Name or Alias</label>
            <form id="search-form">
                <input id="search-field" name="query" type="text" placeholder="e.g. Captain America or Steve Rogers">
                <button id="search-btn" type="submit">Search</button>
            </form>
        </section>
        <section class="results-panel">
            <h2>Result</h2>
            <div id="result"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
